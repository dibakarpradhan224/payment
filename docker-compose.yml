# Database = Supabase (hosted). This runs the API, the web app and an HTTPS reverse proxy.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      TRUST_PROXY: "true"       # only safe because the backend is reachable solely through Caddy
    expose: ["4000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  frontend:
    build:
      context: ./frontend
      args: { API_URL: "http://backend:4000" }
    depends_on: [backend]
    expose: ["3000"]
    restart: unless-stopped
  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
